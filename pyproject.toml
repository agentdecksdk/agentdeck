[project]
name = "agentdeck"
version = "0.1.0"
description = "Declarative harness over the OpenAI Agents SDK and LangGraph: settings, capabilities, skills, runners, graph compilation, plug-in discovery."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "openai-agents==0.17.0",
    # pinned pair: openai 2.33+ added required usage fields that agents 0.17.0 doesn't set
    "openai==2.32.0",
    "redis>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "prompt-toolkit>=3.0",
    "langgraph>=1.1.10",
    "langchain-core>=0.3",
]

[project.scripts]
agentdeck-serve = "agentdeck.serve:main"

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
observability = [
    "langfuse>=2.60",
    "openinference-instrumentation-openai-agents>=0.1",
    "opentelemetry-sdk>=1.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM"]
ignore = ["E501", "UP046", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["agentdeck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentdeck"]
