[project]
name = "agentdeck"
version = "2.0.0b4"
description = "Declarative harness over the OpenAI Agents SDK and LangGraph: settings, capabilities, skills, runners, graph compilation, plug-in discovery."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "openai-agents==0.17.0",
    # pinned pair: openai 2.33+ added required usage fields that agents 0.17.0 doesn't set
    "openai==2.32.0",
    "redis>=5.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "langgraph>=1.1.10",
    "langchain-core>=0.3",
]

[project.scripts]
agentdeck-serve = "agentdeck.serve:main"
agentdeck = "agentdeck.cli:main"

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
observability = [
    "langfuse>=2.60",
    "openinference-instrumentation-openai-agents>=0.1",
    "opentelemetry-sdk>=1.27",
]
durability = [
    # sqlite saver pulls in sqlite-vec (a langgraph vector-store dep unrelated to
    # checkpointing) — kept optional rather than in core deps for that reason.
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
    # the Postgres event log's driver. `[binary]` explicitly: the postgres checkpointer
    # already pulls plain `psycopg` in, which needs a system libpq that a fresh CI runner
    # or dev box does not have, so the transitive dependency imports and then fails.
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "ty>=0.0.1a21",
    "pre-commit>=4.0",
    # pinned: a contract that passes today must not start failing on a linter upgrade
    "import-linter==2.13",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "SIM", "TC", "TID251"]
ignore = ["E501", "UP046", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["agentdeck"]

# import-linter can't express this one: `agents.mcp` is a subpackage of an external
# package, which its contracts reject outright. Ruff sees the import statement itself,
# so the ban lands where the SDK is actually named.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"agents.mcp".msg = "the MCP client is adapters/tools/mcp's alone — take tools off a ToolSet instead"

[tool.ruff.lint.per-file-ignores]
"agentdeck/adapters/tools/mcp/*" = ["TID251"]
"tests/test_mcp_tool_source.py" = ["TID251"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "agentdeck.runtime.settings.LayeredSettings",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# tests/golden/conftest.py imports fake_model by name, tests/contract imports contract_cases
# and tests/ imports concurrency_worker; all three basenames are unique across test dirs,
# because a shared one collides on sys.modules. Explicit beats pytest's implicit basedir
# insertion, which would go ambiguous if tests/conftest.py appeared.
pythonpath = ["tests", "tests/golden", "tests/contract"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentdeck"]

[tool.ty.rules]
# optional-extra imports carry `ty: ignore[unresolved-import]` — "unused" or not
# depends on which extras the local venv has, so don't police it
unused-ignore-comment = "ignore"
