# Cloudflare Tunnel for Jack — the reproducible, locally-managed form.
#
#     cloudflared tunnel create ask-agentdeck          # writes ~/.cloudflared/<uuid>.json
#     # put the printed <uuid> below, then:
#     cloudflared tunnel --config cloudflared.yml run ask-agentdeck
#
# This file is here so a reader can reproduce the deployment. AgentDeck's own instance is run
# from a **dashboard-managed** tunnel instead, whose ingress lives in Cloudflare rather than in
# this file — see the README. Either form is fine; what matters is that the rules below are the
# rules in force, because the README's claims about exposure depend on them.
#
# `--config` is not optional. cloudflared defaults to `~/.cloudflared/config.yml`, which on a
# machine already running another tunnel belongs to that one — merging into it would put this
# service and an unrelated one behind the same process, so a restart for either restarts both.
#
# ## What this can reach
#
# One hostname, one local port, and a catch-all that refuses everything else. The catch-all is
# the load-bearing line: without it a hostname that resolves to this tunnel but is not listed
# above gets a 502 from an attempted proxy rather than a flat refusal, and the ingress list
# stops being an allowlist.
#
# The tunnel reaches `localhost:8100` and nothing else on this machine. It is an outbound
# connection — no inbound port is opened, no firewall rule is needed, and nothing else you run
# locally becomes reachable by adding it.
#
# Serve on the loopback interface, which is uvicorn's default:
#
#     uvicorn jack.server:app --port 8100          # binds 127.0.0.1
#
# Not `--host 0.0.0.0`. That would publish the assistant to every machine on your network in
# addition to the tunnel, which is the one way this setup leaks past what is written here.

tunnel: ask-agentdeck
credentials-file: ~/.cloudflared/REPLACE-WITH-YOUR-TUNNEL-UUID.json

ingress:
  - hostname: ask.agentdecksdk.com
    service: http://localhost:8100
  - service: http_status:404
