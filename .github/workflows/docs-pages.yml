name: Deploy documentation

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site

    steps:
      - name: Checkout released revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static documentation
        run: npm run build
        env:
          # Baked into the bundle at build time — the site is a static export, so there is no
          # runtime config to read. A repository variable rather than a literal, so pointing the
          # panel somewhere else is a settings change and not a commit. Unset, the bundle falls
          # back to localhost, and the panel degrades with a message naming the URL it tried.
          #
          # This must be https: Pages is served over TLS and a browser hard-blocks an HTTPS page
          # calling http://, which is the real reason the backend needs a tunnel rather than a
          # port forward. Never put a secret here — NEXT_PUBLIC_* is public by construction, and
          # everything under it is readable in the shipped JavaScript.
          NEXT_PUBLIC_AGENTDECK_API_URL: ${{ vars.ASK_AGENTDECK_API_URL }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
