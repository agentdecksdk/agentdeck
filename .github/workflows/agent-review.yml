name: Agent review gate

on:
  # Trusted base-branch code judges the PR, and only ever `pull_request_target`: this job is a
  # required check, so its check run has to land on the PR head SHA that branch protection reads.
  # A review submission re-fires it from agent-review-rerun.yml instead.
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Agent review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require a passing review of the current content
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Keyed to the content, not the commit: a rebase or a `dev` merge that changes no
          # line of the diff keeps its review, and any real push invalidates it. `git patch-id`
          # reads a diff on stdin and needs no repository, so nothing from the PR is checked out.
          patch=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            -H "Accept: application/vnd.github.v3.diff" \
            | git patch-id --stable | cut -d' ' -f1)
          if [ -z "$patch" ]; then
            echo "::error::No patch id for this PR: an empty diff, or one too large for the API to serve."
            exit 1
          fi
          reviews=$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")
          if ! jq -e --arg patch "$patch" '
            add
            | map(select(
                .state == "COMMENTED"
                and (.author_association == "OWNER"
                     or .author_association == "MEMBER"
                     or .author_association == "COLLABORATOR")
                and ((.body // "") | contains("patch=" + $patch))
                and (((.body // "") | contains("<!-- agentdeck-review: pass"))
                     or ((.body // "") | contains("<!-- agentdeck-review: block")))
              ))
            | sort_by(.submitted_at)
            | last
            | (.body // "")
            | contains("<!-- agentdeck-review: pass")
          ' <<< "$reviews"; then
            echo "::error::Current content needs a passing AgentDeck review from a repository member, marked with patch=$patch."
            exit 1
          fi
