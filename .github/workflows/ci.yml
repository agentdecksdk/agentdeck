name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    # The Redis and Postgres event logs are contract-tested against real servers (#75) —
    # a store proved only against a mock is not proved. Service containers rather than
    # testcontainers: the gate already installs one dependency set and runs one command,
    # and this keeps the servers out of the Python environment entirely.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentdeck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Spelled out rather than left to the harness's own defaults, so the addresses the
    # gate runs against are visible next to the containers that serve them.
    env:
      AGENTDECK_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      AGENTDECK_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/agentdeck_test
    steps:
      - uses: actions/checkout@v4
        with:
          # The schema's backward-compatibility gate (#47) loads the newest *released*
          # reader out of git — by tag — and measures this tree's events against it. The
          # default depth-1 checkout has neither that tag nor its history, so the gate
          # would skip, which is exactly the "proved nothing and went green" outcome the
          # skip ceiling below exists to catch.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # durability pulls in the sqlite checkpointer that the langgraph half of the
      # contract suite and UC2's kill/restart/approve tests need — omitting it here
      # let ~16 tests skip silently in the gate of record for months (#33).
      # observability was the same mistake one extra over (#142): without it the 12
      # tests in test_observability.py and test_langfuse_tracer.py skip, which is how
      # #141's keyless-AsyncOpenAI regression shipped green. Install every extra the
      # suite guards on — a narrower gate is a gate that lies.
      - name: Install
        run: uv pip install -e ".[dev,serve,durability,observability]"
      - name: Lint
        run: .venv/bin/ruff check agentdeck/ tests/
      - name: Typecheck
        run: .venv/bin/ty check agentdeck
      - name: Import contracts
        run: .venv/bin/lint-imports
      - name: Test
        run: .venv/bin/pytest tests/ -q --junit-xml=/tmp/pytest-results.xml
      # Guard against a whole subsystem silently dropping out of the gate again (#33): a
      # full run with every guarded extra installed skips ~32 tests today — parametrized
      # "only applies to X" contract cases, and nothing else. The ceiling dropped 46 → 34
      # when #142 added [observability] to the install: those 12 tests now run instead of
      # skipping, and leaving the ceiling at 46 would have handed the guard 12 tests of
      # slack — exactly the blind spot #33 is about. Keep the headroom this tight so a
      # subsystem dropping out still trips it. Bump it only with a stated reason.
      # The ceiling is deliberately unchanged for the Redis/Postgres stores (#75): with the
      # services above they add ~80 running tests and no skips, and if a container fails to
      # come up they skip instead — which takes the count to ~120 and fails here, exactly
      # the "proved nothing and went green" outcome this guard is for.
      - name: Guard against silently-skipped durability tests
        run: |
          ceiling=34
          # `bash -e` aborts on grep's own exit code before the `-z` check below ever
          # runs; `|| true` keeps a missing/truncated/attribute-less XML falling through
          # to that check instead of failing silently with no diagnostic.
          skipped=$(grep -oP '(?<=skipped=")[0-9]+' /tmp/pytest-results.xml | head -1 || true)
          echo "skipped=$skipped (ceiling=$ceiling)"
          if [ -z "$skipped" ] || [ "$skipped" -gt "$ceiling" ]; then
            echo "::error::skip count ($skipped) exceeds ceiling ($ceiling) — a subsystem (e.g. durability) may have silently dropped out of the gate. See issue #33."
            exit 1
          fi
      # `Test` already replayed the goldens once; this second, separate process is what
      # proves the snapshots don't depend on process state (in-process stability has its
      # own test).
      - name: Golden replay (second process)
        run: .venv/bin/pytest tests/golden -q
      - name: Build
        run: uv build
