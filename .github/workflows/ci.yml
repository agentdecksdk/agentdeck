name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install
        run: uv pip install -e ".[dev,serve]"
      - name: Lint
        run: .venv/bin/ruff check agentdeck/ tests/
      - name: Typecheck
        run: .venv/bin/ty check agentdeck
      - name: Test
        run: .venv/bin/pytest tests/ -q
      - name: Build
        run: uv build
