name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  check:
    runs-on: ubuntu-latest
    # The Redis and Postgres event logs are contract-tested against real servers (#75) —
    # a store proved only against a mock is not proved. Service containers rather than
    # testcontainers: the gate already installs one dependency set and runs one command,
    # and this keeps the servers out of the Python environment entirely.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentdeck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Spelled out rather than left to the harness's own defaults, so the addresses the
    # gate runs against are visible next to the containers that serve them.
    env:
      AGENTDECK_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      AGENTDECK_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/agentdeck_test
    steps:
      - uses: actions/checkout@v4
        with:
          # The schema's backward-compatibility gate (#47) loads the newest *released*
          # reader out of git — by tag — and measures this tree's events against it. The
          # default depth-1 checkout has neither that tag nor its history, so the gate
          # would skip, and prove nothing while going green.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # durability pulls in the sqlite checkpointer that the langgraph half of the
      # contract suite and UC2's kill/restart/approve tests need — omitting it here
      # let ~16 tests skip silently in the gate of record for months (#33).
      # observability was the same mistake one extra over (#142): without it the 12
      # tests in test_observability.py and test_langfuse_tracer.py skip, which is how
      # #141's keyless-AsyncOpenAI regression shipped green. Install every extra the
      # suite guards on — a narrower gate is a gate that lies.
      - name: Install
        run: uv pip install -e ".[dev,serve,durability,observability]"
      # Two seconds here beats a full suite that skips the half it was meant to prove: if an
      # extra silently failed to install, every test guarding on it turns into a skip and the
      # gate goes green having measured nothing (#33, #142).
      - name: Every guarded extra is importable
        run: .venv/bin/python -c "import langgraph.checkpoint.sqlite, langfuse, psycopg, redis"
      - name: Lint
        run: .venv/bin/ruff check agentdeck/ tests/
      - name: Typecheck
        run: .venv/bin/ty check agentdeck
      - name: Import contracts
        run: .venv/bin/lint-imports
      - name: Test
        run: .venv/bin/pytest tests/ -q --junit-xml=/tmp/pytest-results.xml
      # Skips come in two kinds. "only a suspended case can be resumed" is the contract matrix
      # declaring which cells apply — harmless, and it grows whenever a case is added, which is
      # why counting total skips drifted and false-positived. "needs the [durability] extra" or
      # "no Postgres at ..." is a subsystem that dropped out of the gate, which is the thing
      # #33 is actually about. Match the reasons, not the count: this never needs maintaining
      # when the test matrix moves, and when it fires it names what is missing.
      - name: No subsystem dropped out of the gate
        run: |
          if grep -qE 'needs the \[[a-z]+\] extra|no Postgres at|no Redis at' /tmp/pytest-results.xml; then
            echo "::error::a subsystem skipped out of the gate — an extra or a service container is missing"
            grep -oE 'needs the \[[a-z]+\] extra|no (Postgres|Redis) at [^"]*' /tmp/pytest-results.xml | sort -u
            exit 1
          fi
      # `Test` already replayed the goldens once; this second, separate process is what
      # proves the snapshots don't depend on process state (in-process stability has its
      # own test).
      - name: Golden replay (second process)
        run: .venv/bin/pytest tests/golden -q
      - name: Build
        run: uv build
