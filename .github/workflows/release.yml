name: Release

# Tag main with vX.Y.Z, or a PEP 440 pre-release (vX.Y.ZbN, vX.Y.ZrcN), to release:
# verifies the tag matches pyproject version, runs the full gate, builds, and
# publishes a GitHub Release with the sdist + wheel attached.
# Any v* tag fires and the version check below is the gate: a narrower glob silently
# does not trigger on a tag it fails to match, which is the worse failure mode.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Verify tag matches pyproject version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "pyproject version $version != tag $tag" >&2
            exit 1
          fi
      - name: Install and check
        run: |
          uv pip install -e ".[dev,serve]"
          .venv/bin/ruff check agentdeck/ tests/
          .venv/bin/ty check agentdeck
          .venv/bin/pytest tests/ -q
      - name: Build
        run: uv build
      - name: Extract CHANGELOG section
        run: |
          # Release notes are the curated CHANGELOG section, not a commit list: extract the
          # block from "## [<version>]" up to the next "## [" heading or the link-refs block.
          # A missing section fails loudly — a release without curated notes is the bug this
          # step exists to prevent, so there is no --generate-notes fallback. Known limit: a
          # line starting "## [" or "[" inside the section body (e.g. in a code fence)
          # truncates extraction early — no CHANGELOG section does this today.
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## [$version]" '
            index($0, want) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found && index($0, "[") == 1 { exit }
            found { print }
          ' CHANGELOG.md | awk 'NF{p=1} p' | tac | awk 'NF{p=1} p' | tac > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for heading '## [$version]' — add release notes to CHANGELOG.md before tagging." >&2
            exit 1
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anything that is not exactly X.Y.Z is a pre-release, so a beta never becomes the
          # repo's "Latest release". Defaulting this way means an odd tag errs toward hidden.
          flags="--notes-file /tmp/release-notes.md"
          if [[ ! "${GITHUB_REF_NAME#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flags="$flags --prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" $flags
      - name: Deploy docs
        env:
          GH_TOKEN: ${{ github.token }}
        # A release created with GITHUB_TOKEN never fires the `release: published`
        # trigger (GitHub's recursion guard), so the docs deploy is chained here;
        # workflow_dispatch is exempt from that guard.
        run: gh workflow run docs-pages.yml --ref "$GITHUB_REF_NAME"
