name: Release

# Tag main with vX.Y.Z, or a PEP 440 pre-release (vX.Y.ZbN, vX.Y.ZrcN), to release:
# verifies the tag matches pyproject version, runs the full gate, builds, and
# publishes a GitHub Release with the sdist + wheel attached.
# Any v* tag fires and the version check below is the gate: a narrower glob silently
# does not trigger on a tag it fails to match, which is the worse failure mode.
on:
  push:
    tags: ["v*"]
  # A dropped tag-push event leaves a tag with no release and no way to recover it
  # without re-tagging, which the release process forbids. Dispatch against the tag ref
  # instead: the version check below still gates it, so this cannot publish the wrong thing.
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # the Deploy docs step dispatches docs-pages.yml

jobs:
  release:
    runs-on: ubuntu-latest
    # Same service containers as ci.yml (#75): without them the Redis and Postgres store
    # tests skip, and a release gate that skips ~80 tests a merge gate ran is a narrower
    # gate — which is the thing this job's own comment below forbids.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentdeck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENTDECK_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      AGENTDECK_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/agentdeck_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Verify tag matches pyproject version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "pyproject version $version != tag $tag" >&2
            exit 1
          fi
      - name: Install and check
        # Same extras as ci.yml — a release build must run the same gate as a merge, not a
        # narrower one.
        run: |
          uv pip install -e ".[dev,serve,durability,observability]"
          .venv/bin/python -c "import langgraph.checkpoint.sqlite, langfuse, psycopg, redis"
          .venv/bin/ruff check agentdeck/ tests/
          .venv/bin/ty check agentdeck
          .venv/bin/lint-imports
          .venv/bin/pytest tests/ -q --junit-xml=/tmp/pytest-results.xml
          if grep -qE 'needs the \[[a-z]+\] extra|no Postgres at|no Redis at' /tmp/pytest-results.xml; then
            echo "::error::a subsystem skipped out of the gate — an extra or a service container is missing" >&2
            grep -oE 'needs the \[[a-z]+\] extra|no (Postgres|Redis) at [^"]*' /tmp/pytest-results.xml | sort -u >&2
            exit 1
          fi
      - name: Build
        run: uv build
      - name: Upload distributions
        # Handed to the `pypi` job rather than rebuilt there: publishing an artifact a second
        # build produced is publishing something the gate above never ran against.
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract CHANGELOG section
        run: |
          # Release notes are the curated CHANGELOG section, not a commit list: extract the
          # block from "## [<version>]" up to the next "## [" heading or the link-refs block.
          # A missing section fails loudly — a release without curated notes is the bug this
          # step exists to prevent, so there is no --generate-notes fallback. Known limit: a
          # line starting "## [" or "[" inside the section body (e.g. in a code fence)
          # truncates extraction early — no CHANGELOG section does this today.
          version="${GITHUB_REF_NAME#v}"
          awk -v want="## [$version]" '
            index($0, want) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found && index($0, "[") == 1 { exit }
            found { print }
          ' CHANGELOG.md | awk 'NF{p=1} p' | tac | awk 'NF{p=1} p' | tac > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for heading '## [$version]' — add release notes to CHANGELOG.md before tagging." >&2
            exit 1
          fi
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anything that is not exactly X.Y.Z is a pre-release, so a beta never becomes the
          # repo's "Latest release". Defaulting this way means an odd tag errs toward hidden.
          flags="--notes-file /tmp/release-notes.md"
          if [[ ! "${GITHUB_REF_NAME#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            flags="$flags --prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" $flags
      - name: Deploy docs
        env:
          GH_TOKEN: ${{ github.token }}
        # A release created with GITHUB_TOKEN never fires the `release: published`
        # trigger (GitHub's recursion guard), so the docs deploy is chained here;
        # workflow_dispatch is exempt from that guard.
        run: gh workflow run docs-pages.yml --ref "$GITHUB_REF_NAME"

  pypi:
    # Publishing is off until the repository variable PYPI_PUBLISH is set to "true".
    # Without that gate the first tag after this lands turns a green release red: the PyPI
    # project and its Trusted Publisher are created by hand in the PyPI UI, and until they
    # exist every upload is rejected. Flip the variable in the same sitting as creating them.
    if: vars.PYPI_PUBLISH == 'true'
    needs: release
    runs-on: ubuntu-latest
    # A separate job so `id-token: write` is scoped to the one step that needs it, rather than
    # granted to the whole workflow at the top of this file. It is the credential that lets
    # anything running here mint an identity PyPI trusts.
    permissions:
      id-token: write
    # The environment is the second half of the Trusted Publisher's identity — PyPI is
    # configured with owner/repo *and* workflow *and* environment, so a job running anywhere
    # else in this repository cannot publish. Name it exactly `pypi` there.
    environment:
      name: pypi
      url: https://pypi.org/project/agentdeck/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-dispatching a tag whose version is already on PyPI should be a no-op, not a
          # failure: the rest of this workflow is re-runnable and an upload that hard-fails on
          # a duplicate would be the only step that is not.
          skip-existing: true
