# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies, resolved through uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR for the week's minor and patch bumps: they share `uv.lock`, so separate branches
    # each resolve against the same base and only the first can merge (#499). Majors stay on
    # their own, because a major is a migration, and a migration inside a batch is one nobody
    # reviews.
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The pinned action refs in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Same split, and #477 is why majors are excluded: setup-uv v5 to v7 needed
    # `activate-environment: true` at the call site, not just a new tag.
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The two npm projects: docs-site's build and the AGUI conformance fixture's pinned client.
  # Neither ships to a user, and `npm ci`'s own audit went unread into a captured pipe (#650),
  # so this is where an npm advisory becomes something somebody sees.
  - package-ecosystem: "npm"
    directories:
      - "/docs-site"
      - "/tests/bindings/agui_client"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
