# Packaged defaults for ``agentdeck.runtime.settings``.
#
# Resolution order: ``AGENTDECK_CONFIG_PATH`` → ``<repo>/config.yaml`` →
# this file. Every section maps 1:1 to a settings class; shell env
# vars (``OPENAI_BASE_URL`` etc.) still win.

openai:
  api_key: ""
  base_url: ""          # empty => SDK default (api.openai.com)
  model: gpt-4.1-mini

runner:
  workflow_name: agentdeck
  temperature: 1.0
  max_turns: 30
  max_tokens: null  # cap on tokens per model response; null => model default (uncapped)

checkpoint:
  # LangGraph checkpointer for ``durable=True`` workflows. The scheme names the backend:
  # sqlite:// | postgresql:// | memory://. postgresql needs the ``[durability]`` extra.
  url: sqlite://.agentdeck/checkpoints.sqlite3

session:
  url: null              # null => in-process SQLite fallback (dev only); else a redis:// URL, needing the ``[redis]`` extra
  redis_key_prefix: agents:session
  redis_ttl: null

shell:
  yield_floor_ms: 600000
  max_output_tokens: 15000

langfuse:
  # LLM-observability tracing export (Langfuse). Disabled until BOTH keys are
  # set (AGENTDECK_LANGFUSE_PUBLIC_KEY / _SECRET_KEY, or the fields below).
  public_key: ""
  secret_key: ""
  base_url: http://localhost:3000
  environment: local
