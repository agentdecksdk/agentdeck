  <title>AgentDeck</title>
  <desc>Square AgentDeck mark for favicons, app icons and avatars. Full colour rather than
  currentColor, because a favicon is only ever loaded as a file: with no parent to inherit
  from, currentColor resolves to black, and a black card on dark browser chrome is invisible.
  Inline uses want logo-mark.svg instead. The spark is dropped here for the reason below.</desc>
