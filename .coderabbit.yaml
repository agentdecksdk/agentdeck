# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
#
# CodeRabbit review configuration.
#
# Two things this file is mostly about:
#
#   1. **Not burning the review quota.** `auto_incremental_review` defaults to
#      re-running the whole review on every push. This repo's workflow opens a
#      draft PR on the first commit and pushes as it goes (CLAUDE.md, "Git /
#      release"), so a single slice can be ten or more pushes — and the free-tier
#      limit is per developer across every PR at once. It was exhausted on the
#      first day. Reviews are now triggered once when a PR leaves draft, and
#      after that on demand with `@coderabbitai review`.
#   2. **Not reviewing generated or frozen files.** Several artifacts here are
#      machine-written or deliberately immutable, and a review comment on one is
#      always wrong: the fix belongs in the generator, or the file is a contract
#      that is supposed to be hard to change.

language: en-US

reviews:
  profile: chill
  # `dev` is the default branch and every PR targets it, so `base_branches`
  # needs no entry — it lists branches *other than* the default.
  auto_review:
    enabled: true
    # Draft is the working state here, not an unfinished afterthought: PRs open
    # as drafts and flip with `gh pr ready` once the author's own `make check`
    # is green. That flip is the right moment for a first review, and reviewing
    # before it would spend a review on work its own author has not gated yet.
    drafts: false
    # The quota fix. Off means one review when the PR goes ready; ask for
    # another with `@coderabbitai review` once findings are addressed, rather
    # than paying for one per push.
    auto_incremental_review: false

  path_filters:
    # Generated by `scripts/generate_docs_reference.py` (`make docs-reference`).
    # Every line is derived from CHANGELOG.md, the settings models or the CLI's
    # argparse tree — review those instead.
    - "!docs-site/content/changelog.mdx"
    - "!docs-site/content/reference/settings.mdx"
    - "!docs-site/content/reference/cli.mdx"
    - "!docs-site/public/llms.txt"
    - "!docs-site/public/llms-full.txt"
    # Frozen by design. `tests/golden/` replays the v1 HTTP/SSE wire byte-for-byte
    # and `tests/core/snapshots/` pins the event schema; both regenerate only
    # through `make golden`, deliberately, with a PR justification. A suggestion
    # to "improve" one of these is a suggestion to break the contract they exist
    # to hold.
    - "!tests/golden/snapshots/**"
    - "!tests/core/snapshots/**"
    # Generated by the roadmap sync (`make roadmap-sync`) between explicit markers.
    - "!docs/delivery/roadmap-v3*.md"

  path_instructions:
    - path: "agentdeck/core/**"
      instructions: >-
        `core/` may import stdlib and pydantic ONLY — no third-party SDK, no
        other agentdeck subpackage. This is enforced by import-linter
        (`.importlinter`, `make lint-imports`), so flag any new import here as a
        build-breaking change, not a style preference.

    - path: "agentdeck/core/events.py"
      instructions: >-
        Events are constructed through payload classes, never hand-built dicts,
        and consumers use `Event.model_validate` and must tolerate
        `UnknownEvent`. New event kinds or envelope changes belong in a
        dedicated schema PR (docs/coding-standards.md §7) and require a
        deliberate `make golden` regeneration — flag them if they arrive
        alongside unrelated work.

    - path: "agentdeck/adapters/**"
      instructions: >-
        Adapters are the only place a third-party SDK may be imported, and each
        adapter imports exactly its own SDK. A backend that is not a default
        (Postgres, Redis) must resolve its client import lazily, inside the
        branch that selects it, so that a base install never imports it — the
        rule is "base carries exactly what the defaults need; extras carry every
        non-default backend."

    - path: "agentdeck/**"
      instructions: >-
        agentdeck owns configuration only — settings, discovery, runner glue,
        graph compilation. Execution stays in the Agents SDK / LangGraph; flag
        any execution logic migrating into this package. Environment variables
        agentdeck owns are `AGENTDECK_*` without exception; only variables a
        third-party SDK reads natively (`OPENAI_*`, `TAVILY_*`) keep their own
        names, and the retired `SYSAGENT_*` prefix must never reappear. A
        `ty: ignore` is acceptable only at a deliberate SDK shim and only with a
        comment saying why.

    - path: "**/*.py"
      instructions: >-
        Anti-slop focus, judgment calls only (ruff owns deterministic style):
        flag comments that narrate visible code instead of stating a
        non-obvious why; flag any new public abstraction whose responsibility
        an existing symbol already owns — the PR body's '## Reuse analysis' is
        the author's own evidence, hold them to it; flag speculative
        configuration and single-implementation indirection.

    - path: "tests/**"
      instructions: >-
        Tests must be offline and deterministic — no network, no real model
        call. Scripted models come from `agentdeck.testing` (`ScriptedModel`,
        `patch_model`, `scripted_model_server`); flag a hand-rolled fourth one.
        Prefer asserting on observable behaviour over internal calls.

    - path: "docs-site/content/**"
      instructions: >-
        Check every code sample against the current public API — this site has
        shipped examples that no longer ran. A fenced block marked ```python run
        is executed by `tests/test_docs_examples.py`; one marked `illustrative`
        must carry a `reason=`. Install lines name the distribution
        `agentdeck-sdk` (the import stays `agentdeck`), and any `git+` install
        must pin `@vX.Y.Z` matching pyproject.

    - path: "pyproject.toml"
      instructions: >-
        `openai==2.32.0` is pinned to `openai-agents==0.17.0` deliberately —
        openai 2.33+ crashes the run loop. Flag any loosening. Base
        dependencies carry only what the shipped defaults need; every
        non-default backend belongs in an extra.

chat:
  auto_reply: true
